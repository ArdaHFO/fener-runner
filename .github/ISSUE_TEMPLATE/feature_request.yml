name: Feature request / Özellik önerisi
description: Suggest a focused improvement to the mobile game.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Player need / Oyuncu ihtiyacı
      description: What should become easier, clearer or more enjoyable?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / Önerilen davranış
      description: Consider touch controls and mobile performance.
    validations:
      required: true
